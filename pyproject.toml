[project]
name = "iron-counsel"
version = "0.1.0"
description = "Telegram RAG bot — Game of Thrones quotes via Gemma 3 + Firestore"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "google-cloud-firestore==2.32.0",
    "grpcio>=1.83.0,<2",
    "httpx==0.28.1",
    "langchain>=1.3.9,<2",
    "langchain-core>=1.2.22,<2",
    "langchain-community>=0.4.2,<1",
    "langchain-groq>=1.1.3,<2",
    "langsmith>=0.8.18,<0.9",
    "pydantic-settings==2.15.0",
    "python-telegram-bot==22.8",
    "uvicorn[standard]==0.54.0",
    "tqdm>=4.70.0",
    "fastembed==0.9.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# FastEmbed declares Pillow only for its optional image-embedding path. Iron Counsel
# embeds text only; use the patched Pillow release and validate the text path directly.
[tool.uv]
override-dependencies = ["pillow>=13.0.0,<14"]
