[project]
name = "iron-counsel"
version = "0.1.0"
description = "Telegram RAG bot — Game of Thrones quotes via Gemma 3 + Firestore"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "google-cloud-firestore==2.28.0",
    "httpx==0.28.1",
    "langchain==0.3.19",
    "langchain-core==0.3.40",
    "langchain-community>=0.3.0",
    "langchain-groq>=0.2.4",
    "pydantic-settings==2.15.0",
    "python-telegram-bot==22.8",
    "uvicorn[standard]==0.52.4",
    "tqdm>=4.70.0",
    "fastembed>=0.4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
